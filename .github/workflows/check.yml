name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/sitemap.xml
          test -f dist/sw.js
          test ! -e dist/demos
          test ! -e dist/en/demos
          # Route coverage is checked against the registry by verify-dist.mjs.
